[package]
name = "sastra-compressor"
version = "2.0.0"
description = "Compresses images, audio, and video for the Sastra visual novel engine"
authors = ["Ken “Krysion” Nisaka"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "sastra_compressor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff", "gif"] }
webp = { version = "0.3", default-features = false }
trash = "5"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
tauri-winrt-notification = "0.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
